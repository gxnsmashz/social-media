<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FIRE TEAM RANDOMIZER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap');
:root{--bg:#080b16;--card:#101528;--card2:#151c34;--blue:#37a7ff;--cyan:#62e8ff;--purple:#8b5cf6;--text:#f5f7ff;--muted:#8993ae;--line:#283250}
*{box-sizing:border-box} body{margin:0;font-family:Kanit,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,#16345c 0,transparent 35%),radial-gradient(circle at 90% 15%,#281650 0,transparent 32%),var(--bg);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:1100px;margin:auto;padding:35px 18px 60px}.hero{text-align:center;margin-bottom:25px}.badge{display:inline-block;padding:6px 14px;border:1px solid #3e8bff55;border-radius:999px;color:var(--cyan);background:#36aaff0d;font-size:13px;letter-spacing:1.5px}.hero h1{font-size:clamp(32px,6vw,62px);margin:10px 0 0;font-weight:800;line-height:1;background:linear-gradient(90deg,#fff,var(--cyan),#9c7bff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);margin:12px 0}
.panel{background:linear-gradient(145deg,#12192dE8,#0d1324E8);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(12px)}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.modes{display:flex;gap:8px;flex-wrap:wrap}.mode{border:1px solid var(--line);background:#0c1222;color:#aab5d1;padding:10px 18px;border-radius:12px;font-family:inherit;font-weight:600;cursor:pointer}.mode.active{background:linear-gradient(135deg,#278fff,#704cff);color:white;border-color:transparent;box-shadow:0 8px 25px #3d82ff44}
.count{color:var(--muted);font-size:14px}.count b{color:white}.inputrow{display:flex;gap:10px;margin:18px 0}.inputrow input{flex:1;background:#090e1b;border:1px solid var(--line);outline:none;color:white;border-radius:13px;padding:13px 15px;font:inherit}.inputrow input:focus{border-color:#4b9dff}.btn{border:0;border-radius:13px;padding:12px 20px;color:#fff;background:linear-gradient(135deg,#248fff,#714cff);font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #4288ff35}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.secondary{background:#1a233b;box-shadow:none;border:1px solid var(--line)}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;max-height:300px;overflow:auto;padding-right:4px}.player{display:flex;align-items:center;gap:9px;background:#0b1120;border:1px solid #202b46;border-radius:12px;padding:9px 11px}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:#18233d;color:#72c7ff;font-size:12px}.player span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del{background:none;border:0;color:#68748f;cursor:pointer;font-size:18px}.del:hover{color:#ff5e75}.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}.actions .btn{min-width:190px}.result{margin-top:22px;display:none}.result.show{display:block}.result h2{text-align:center;margin:0 0 16px}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.team{padding:18px;border-radius:18px;background:linear-gradient(145deg,#121c35,#0d1426);border:1px solid #2a3a5d;position:relative;overflow:hidden}.team:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-55px;top:-55px;background:#3aaaff20}.team h3{margin:0 0 12px;color:var(--cyan);font-size:21px}.member{display:flex;align-items:center;gap:10px;background:#080d19aa;border:1px solid #202b43;border-radius:10px;padding:8px 10px;margin:7px 0}.member b{margin-left:auto;color:#6f7c98;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px}.note{text-align:center;color:#69748f;font-size:12px;margin-top:15px}
@media(max-width:650px){.inputrow{flex-direction:column}.teams{grid-template-columns:1fr}.panel{padding:15px}.players{grid-template-columns:1fr 1fr}.modes{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="badge">FREE FIRE • TEAM RANDOMIZER</span>
    <h1>RANDOM TEAM</h1>
    <p>สุ่มทีมแข่งแบบแฟร์ ๆ พร้อมจัดผู้เล่นให้อัตโนมัติ</p>
  </header>

  <main class="panel">
    <div class="top">
      <div class="modes">
        <button class="mode active" data-size="4">2 VS 2</button>
        <button class="mode" data-size="6">3 VS 3</button>
        <button class="mode" data-size="8">4 VS 4</button>
        <button class="mode" data-size="10">5 VS 5</button>
        <button class="mode" data-size="12">6 VS 6</button>
      </div>
      <div class="count">ผู้เล่น <b id="count">0 / 4</b></div>
    </div>

    <div class="inputrow">
      <input id="nameInput" placeholder="กรอกชื่อผู้เล่น เช่น Gun, Bank, Boss..." autocomplete="off">
      <button class="btn" id="addBtn">+ เพิ่มผู้เล่น</button>
    </div>

    <div id="players" class="players"><div class="empty">ยังไม่มีรายชื่อผู้เล่น</div></div>

    <div class="actions">
      <button class="btn secondary" id="demoBtn">ใส่รายชื่อทดสอบ</button>
      <button class="btn" id="randomBtn">⚡ สุ่มทีม</button>
      <button class="btn secondary" id="clearBtn">ล้างทั้งหมด</button>
    </div>

    <section id="result" class="result">
      <h2>⚔️ ผลการสุ่มทีม</h2>
      <div id="teams" class="teams"></div>
      <div class="actions"><button class="btn" id="againBtn">🔄 สุ่มใหม่</button></div>
    </section>
    <div class="note">ระบบจะสลับผู้เล่นแบบสุ่มทุกครั้งที่กดสุ่มทีม</div>
  </main>
</div>

<script>
let maxPlayers=4, players=[];
const $=id=>document.getElementById(id);
const input=$('nameInput');

document.querySelectorAll('.mode').forEach(btn=>{
  btn.onclick=()=>{
    maxPlayers=+btn.dataset.size;
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    $('result').classList.remove('show');
    render();
  };
});

function add(){
  const name=input.value.trim();
  if(!name)return;
  if(players.length>=maxPlayers){alert(`โหมดนี้รับได้สูงสุด ${maxPlayers} คน`);return}
  if(players.some(x=>x.toLowerCase()===name.toLowerCase())){alert('ชื่อนี้มีอยู่แล้ว');return}
  players.push(name); input.value=''; input.focus(); render();
}
$('addBtn').onclick=add;
input.onkeydown=e=>{if(e.key==='Enter')add()};

function render(){
  $('count').textContent=`${players.length} / ${maxPlayers}`;
  const box=$('players');
  if(!players.length){box.innerHTML='<div class="empty">ยังไม่มีรายชื่อผู้เล่น</div>';return}
  box.innerHTML=players.map((p,i)=>`
    <div class="player"><span class="num">${String(i+1).padStart(2,'0')}</span>
    <span>${escapeHtml(p)}</span><button class="del" onclick="removePlayer(${i})">×</button></div>`).join('');
}
function removePlayer(i){players.splice(i,1);render()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function randomize(){
  if(players.length!==maxPlayers){alert(`กรุณาใส่ผู้เล่นให้ครบ ${maxPlayers} คนก่อนสุ่ม`);return}
  let a=[...players];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const half=maxPlayers/2, teams=[a.slice(0,half),a.slice(half)];
  $('teams').innerHTML=teams.map((team,i)=>`
    <div class="team"><h3>TEAM ${String.fromCharCode(65+i)}</h3>
      ${team.map((p,j)=>`<div class="member"><span>👤</span><span>${escapeHtml(p)}</span><b>#${j+1}</b></div>`).join('')}
    </div>`).join('');
  $('result').classList.add('show');
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('randomBtn').onclick=randomize;
$('againBtn').onclick=randomize;
$('clearBtn').onclick=()=>{players=[];$('result').classList.remove('show');render()};
$('demoBtn').onclick=()=>{
  const names=['GUN','BANK','BOSS','POND','JACK','MAX','NINE','ICE','ARM','BEAM','MINT','FLUK'];
  players=names.slice(0,maxPlayers);render();
};
render();
</script>
</body>
</html>
